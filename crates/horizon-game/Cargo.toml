[package]
name = "horizon-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as the platform runs it: the engine's entry with the platform's parts registered, for an executable to start (docs/layers.md)"

[dependencies]
horizon-client = { path = "../horizon-client" }
horizon-threads = { path = "../horizon-threads" }
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }

[features]
# Counts the live heap by step and thread (`horizon-ctl memory`, the memory watch's warnings);
# for measuring only.
alloc-census = ["horizon-threads/alloc-census"]

[lints]
workspace = true
